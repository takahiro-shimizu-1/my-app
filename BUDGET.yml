# Economic Governance Configuration for my-app

monthly_budget_usd: 500

thresholds:
  warning: 0.8
  emergency: 1.5

cost_breakdown:
  anthropic_api:
    budget: 400
    model: claude-sonnet-4-20250514
    estimated_tokens_per_month: 10000000

  github_actions:
    budget: 0
    estimated_minutes_per_month: 2000

  hosting:
    budget: 100

emergency_actions:
  disable_workflows:
    - autonomous-agent.yml
    - weekly-kpi-report.yml
    - deploy-pages.yml

  notify_channels:
    - github_issue: true
    - slack: false

monitoring:
  check_interval: hourly
  metrics_retention_days: 90

recovery_protocol:
  requires_guardian_approval: true
  approval_checklist:
    - 根本原因特定完了
    - BUDGET.yml更新完了
    - 不要リソース削除完了
    - 月次予算見直し完了
