[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "judgesystem"
version = "2.0.0"
description = "Scalable bid announcement judgment engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tqdm>=4.65",
    "lxml>=4.9",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
]
gcp = [
    "google-cloud-bigquery>=3.0",
    "google-cloud-storage>=2.0",
    "google-genai>=1.0",
]
ocr = [
    "google-genai>=1.0",
    "PyMuPDF>=1.23",
]
all = [
    "judgesystem[postgres,gcp,ocr]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
judgesystem = "judgesystem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
