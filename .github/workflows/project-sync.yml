name: Sync Issues to Project

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  sync-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    env:
      PROJECT_NUMBER: ${{ vars.GITHUB_PROJECT_NUMBER || '1' }}

    steps:
      - name: Check project automation prerequisites
        id: preflight
        env:
          PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync to GitHub Projects
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/${{ env.PROJECT_NUMBER }}
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}

      - name: Skip Summary
        if: steps.preflight.outputs.enabled != 'true'
        run: |
          echo "GH_PROJECT_TOKEN is not configured, so project sync was skipped." >> $GITHUB_STEP_SUMMARY
