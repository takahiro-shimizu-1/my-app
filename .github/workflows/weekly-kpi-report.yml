name: Weekly KPI Report

# Post weekly KPI report to GitHub Discussions every Monday at 9:00 AM UTC
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-and-post-report:
    runs-on: ubuntu-latest
    name: Generate and post weekly KPI report
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Generate and Post KPI Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
        run: npm run report:kpi

      - name: Summary
        run: |
          echo "### 📊 Weekly KPI Report Posted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Successfully generated and posted weekly KPI report to Discussions or Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Repository: https://github.com/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
