name: Autonomous Agent Execution

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Check if agent should execute
  check-trigger:
    name: Check Agent Trigger
    runs-on: ubuntu-latest
    outputs:
      should_execute: ${{ steps.check.outputs.should_execute }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Check trigger conditions
        id: check
        run: |
          SHOULD_EXECUTE="false"
          ISSUE_NUMBER=""

          # Check if manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_EXECUTE="true"
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            echo "Manual trigger for issue #${ISSUE_NUMBER}"
          fi

          # Check if issue has agent-execute label
          if [ "${{ github.event_name }}" = "issues" ]; then
            LABELS='${{ toJson(github.event.issue.labels.*.name) }}'
            if echo "$LABELS" | grep -Eq "🤖agent-execute|🤖 agent:coordinator"; then
              SHOULD_EXECUTE="true"
              ISSUE_NUMBER="${{ github.event.issue.number }}"
              echo "Issue #${ISSUE_NUMBER} has agent-execute label"
            fi
          fi

          # Check if comment contains /agent command or @miyabi mention
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            COMMENT="${{ github.event.comment.body }}"
            if echo "$COMMENT" | grep -Eq "^/agent|@miyabi"; then
              SHOULD_EXECUTE="true"
              ISSUE_NUMBER="${{ github.event.issue.number }}"
              echo "Comment triggered agent execution for issue #${ISSUE_NUMBER}"
            fi
          fi

          echo "should_execute=${SHOULD_EXECUTE}" >> $GITHUB_OUTPUT
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT

  # Job 2: Execute Autonomous Agents
  execute-agents:
    name: Execute Autonomous Agents
    runs-on: [self-hosted, linux, x64, my-app-local]
    needs: check-trigger
    if: needs.check-trigger.outputs.should_execute == 'true'
    concurrency:
      group: autonomous-agent-${{ needs.check-trigger.outputs.issue_number }}
      cancel-in-progress: false

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compilation check
        run: npm run typecheck

      - name: Check local Claude Code authentication
        id: preflight
        run: |
          if claude auth status | node -e "let raw='';process.stdin.on('data',d=>raw+=d);process.stdin.on('end',()=>{const parsed=JSON.parse(raw);process.exit(parsed.loggedIn ? 0 : 1);});"; then
            echo "can_execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_execute=false" >> "$GITHUB_OUTPUT"
            echo "reason=Claude Code is not logged in on the self-hosted runner" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute local Claude Code pipeline
        id: execute
        if: steps.preflight.outputs.can_execute == 'true'
        run: |
          npm run agents:parallel:exec -- \
            --issue ${{ needs.check-trigger.outputs.issue_number }}

      - name: Upload execution logs
        if: steps.preflight.outputs.can_execute == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-execution-logs-${{ needs.check-trigger.outputs.issue_number }}
          path: |
            .ai/local-runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment on Issue (Skipped)
        if: steps.preflight.outputs.can_execute != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ needs.check-trigger.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Autonomous execution skipped

            ${{ steps.preflight.outputs.reason }}

            Log into Claude Code on the self-hosted runner before retrying.`
            })

      - name: Comment on Issue (Failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ needs.check-trigger.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Autonomous Agent Execution Failed

            **Status**: Failed
            **Run ID**: ${{ github.run_id }}

            ### Error

            The agent execution encountered an error. Please check the logs for details.

            ### Escalation

            This issue has been escalated to @${{ github.repository_owner }} for review.

            [View Logs →](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---

            🤖 Autonomous Operations Agent System`
            })

      - name: Add escalation label on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.addLabels({
              issue_number: ${{ needs.check-trigger.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['🚨 escalated', '❌ agent:failed']
            })
