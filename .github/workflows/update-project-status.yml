name: Update Project Status

# Update project status based on PR state
on:
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [closed, reopened]

jobs:
  update-status:
    runs-on: ubuntu-latest
    name: Update project item status
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Update Project Status
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITHUB_PROJECT_NUMBER: ${{ vars.GITHUB_PROJECT_NUMBER || '1' }}
          EVENT_ACTION: ${{ github.event.action }}
          CONTENT_TYPE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'issue' }}
          CONTENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          npm run project:status
